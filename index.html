<style>
/* Layout: white page, one object. Cipher resolves into a globe of clips stuck to a blue sphere. Business-card line at the base. */
:root{--white:#FFFFFF;--black:#000000;--blue:#002FA7;--caps:"Copperplate","Copperplate Gothic Light","Marcellus SC",Georgia,serif;color-scheme:light}
html,body{height:100%}
body{background:var(--white);color:var(--black);overflow:hidden;margin:0}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#cipher{position:fixed;left:50%;top:45%;width:172px;height:172px;margin:-86px 0 0 -86px;color:var(--blue);opacity:0;transform:scale(.94);transition:opacity .55s ease,transform .7s ease,filter .7s ease;pointer-events:none}
#cipher.on{opacity:1;transform:scale(1)}
#cipher.off{opacity:0;transform:scale(1.02);filter:blur(7px)}
#modes{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;border:1px solid var(--black);background:var(--white)}
#modes button{font:400 12px/1 var(--caps);letter-spacing:.1em;background:var(--white);color:var(--black);border:0;padding:10px 12px;cursor:pointer;white-space:nowrap}
#modes button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
#modes button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#pop{position:fixed;left:0;top:0;width:min(200px,50vw);aspect-ratio:9/16;margin:0;background:#fff;border-radius:10px;box-shadow:0 2px 4px #0003,0 22px 54px #00123f55;opacity:0;pointer-events:none;will-change:transform,opacity}
#halo{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);color:#000;pointer-events:none;overflow:visible;opacity:0;transition:opacity .7s ease}
#halo.on{opacity:.45}
#pop{overflow:hidden}#pop video{width:100%;height:100%;object-fit:cover;display:block}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.mbg.on{display:flex}
.mfr{position:relative;height:min(86vh,calc((100vw - 24px)*16/9));height:min(86svh,calc((100vw - 24px)*16/9));aspect-ratio:9/16;max-width:100%;background:#000;border-radius:26px;overflow:hidden;color:#fff;font:400 14px/1.3 Helvetica,Arial,sans-serif}
.mfr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:pointer}
.mfr::after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,#0000008C);pointer-events:none}
#me{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mfr.em #me{display:block}.mfr.em #mv,.mfr.em .fy,.mfr.em .fr,.mfr.em .fb,.mfr.em .fp{display:none}.mfr.em::after{display:none}
.mfr.plain .fy,.mfr.plain .fr,.mfr.plain .fb{display:none}.mfr.plain::after{display:none}
.fy{position:absolute;top:18px;left:0;right:0;text-align:center;font-weight:700;font-size:15px;z-index:2;pointer-events:none;text-shadow:0 1px 3px #0006}
.fy i{display:block;width:26px;height:2px;background:#fff;margin:5px auto 0;border-radius:2px}
.fr{position:absolute;right:10px;bottom:82px;z-index:2;display:grid;justify-items:center;gap:15px}
#fa[hidden]{display:none}.fr img{width:44px;height:44px;border-radius:50%;border:1.5px solid #fff;object-fit:cover;display:block}
.fi{background:none;border:0;color:#fff;padding:0;display:grid;justify-items:center;gap:2px;font:700 12px/1 Helvetica,Arial,sans-serif;text-shadow:0 1px 3px #0007;cursor:pointer}
.fi svg{width:32px;height:32px;fill:currentColor;filter:drop-shadow(0 1px 3px #0005)}
.fi.liked{color:#FE2C55}.fi span{color:#fff}
.fb{position:absolute;left:14px;right:70px;bottom:22px;z-index:2;display:grid;gap:5px;text-shadow:0 1px 3px #0007;pointer-events:none}
.fb b{font-size:16px}.fb p{margin:0;overflow-wrap:anywhere}.fb small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff40;z-index:3}.fp i{display:block;height:100%;width:0;background:#fff}
.mx{position:absolute;right:12px;top:12px;z-index:4;background:#0000;color:#fff;border:0;width:38px;height:38px;font-size:18px;line-height:1;cursor:pointer;text-shadow:0 1px 3px #0007}
.mx:focus{outline:none}.mx:focus-visible{background:#ffffff26;border-radius:50%}
#pop.go{transition:transform .32s cubic-bezier(.2,.9,.25,1.04),opacity .18s ease}
#logos{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#logos .lt{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 30px}
#logos img{display:block;flex:none;opacity:.42}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:7px;text-align:center;white-space:nowrap}
#name{font:400 clamp(18px,2.2vw,24px)/1.1 var(--caps);letter-spacing:.14em;margin:0}
#line{margin:0;font:400 13px/1.2 var(--caps);letter-spacing:.2em}#line span{font:italic 400 17px/1 'Times New Roman',Times,serif;letter-spacing:0;color:var(--blue);margin:0 .12em}
#mail{font:400 14px/1.2 var(--caps);letter-spacing:.08em;color:var(--blue);text-decoration:none}
#mail:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
</style>
